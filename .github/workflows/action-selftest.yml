#
# Tests the packaging: runs this repository's own action.yml (uses: ./) on the
# small fixture in tests/fixtures/action-selftest/ on every push and pull
# request, and checks that the three seeded cases give the expected results in
# blocking mode, that report mode keeps the check green, that a working-directory
# inside the checkout is refused and that the mode input ignores case and spaces. It only reads the
# repository and needs no secrets. The skip step is switched off here (it needs
# a real pull request with a label); docs/github-action.md says how to try it.

name: action-selftest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  action:
    name: action on the fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Versions
        run: |
          python3 --version
          git --version

      - name: Build the fixture repository
        id: fixture
        run: bash tests/fixtures/action-selftest/build.sh "$RUNNER_TEMP/cg-fixture"

      - name: "Case 1: a change with no test (block)"
        id: no_test
        continue-on-error: true
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/cg-fixture
          base: ${{ steps.fixture.outputs.base }}
          head: ${{ steps.fixture.outputs.no_test }}
          mode: block
          skip-label: ''
          enforce-label: ''

      - name: "Case 2: a test that also passes without the change (block)"
        id: test_passes_on_base
        continue-on-error: true
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/cg-fixture
          base: ${{ steps.fixture.outputs.base }}
          head: ${{ steps.fixture.outputs.test_passes_on_base }}
          mode: block
          skip-label: ''
          enforce-label: ''

      - name: "Case 3: a test that checks the change (block)"
        id: real_test
        continue-on-error: true
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/cg-fixture
          base: ${{ steps.fixture.outputs.base }}
          head: ${{ steps.fixture.outputs.real_test }}
          mode: block
          skip-label: ''
          enforce-label: ''

      - name: "Case 4: a change with no test (report)"
        id: report_only
        continue-on-error: true
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/cg-fixture
          base: ${{ steps.fixture.outputs.base }}
          head: ${{ steps.fixture.outputs.no_test }}
          mode: report
          skip-label: ''
          enforce-label: ''

      # Version 0.3.2 (RC-N9): a working-directory inside the checkout is refused
      # before the guard runs, so this step must fail and give no result.
      - name: "Case 6: a working-directory that is not the top of the checkout"
        id: subfolder
        continue-on-error: true
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/cg-fixture/src
          base: ${{ steps.fixture.outputs.base }}
          head: ${{ steps.fixture.outputs.real_test }}
          mode: report
          skip-label: ''
          enforce-label: ''

      # Version 0.3.2 (RT-N5): case and spaces in the mode input do not matter.
      - name: "Case 7: a change with no test, mode ' Block ' (block)"
        id: mode_case
        continue-on-error: true
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/cg-fixture
          base: ${{ steps.fixture.outputs.base }}
          head: ${{ steps.fixture.outputs.no_test }}
          mode: ' Block '
          skip-label: ''
          enforce-label: ''

      # Finding B1 of the 0.3.0 audit: a pull request that brings a json.py or a
      # sitecustomize.py must not get them run inside the action. They go into the
      # workspace, the folder the action's steps run in, and PYTHONPATH points there.
      - name: Plant a hostile json.py and sitecustomize.py in the workspace
        run: |
          for name in json sitecustomize; do
            printf 'import os\nopen(os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "HOSTILE_RAN_%s"), "w").write("x")\n' "$name" > "$name.py"
          done
          ls -l json.py sitecustomize.py

      - name: "Case 5: a change with no test, hostile files in the workspace (block)"
        id: hostile
        continue-on-error: true
        uses: ./
        env:
          PYTHONPATH: .
        with:
          working-directory: ${{ runner.temp }}/cg-fixture
          base: ${{ steps.fixture.outputs.base }}
          head: ${{ steps.fixture.outputs.no_test }}
          mode: block
          skip-label: ''
          enforce-label: ''

      - name: Remove the hostile files
        if: always()
        run: rm -f json.py sitecustomize.py

      - name: Check the results
        env:
          FIXTURE: ${{ runner.temp }}/cg-fixture
          C1: ${{ steps.no_test.outcome }} ${{ steps.no_test.outputs.result }} ${{ steps.no_test.outputs.cause }} ${{ steps.no_test.outputs.mode }} ${{ steps.no_test.outputs.blocks }}
          C2: ${{ steps.test_passes_on_base.outcome }} ${{ steps.test_passes_on_base.outputs.result }} ${{ steps.test_passes_on_base.outputs.cause }} ${{ steps.test_passes_on_base.outputs.mode }} ${{ steps.test_passes_on_base.outputs.blocks }}
          C3: ${{ steps.real_test.outcome }} ${{ steps.real_test.outputs.result }} ${{ steps.real_test.outputs.cause }} ${{ steps.real_test.outputs.mode }} ${{ steps.real_test.outputs.blocks }}
          C4: ${{ steps.report_only.outcome }} ${{ steps.report_only.outputs.result }} ${{ steps.report_only.outputs.cause }} ${{ steps.report_only.outputs.mode }} ${{ steps.report_only.outputs.blocks }}
          C5: ${{ steps.hostile.outcome }} ${{ steps.hostile.outputs.result }} ${{ steps.hostile.outputs.cause }} ${{ steps.hostile.outputs.mode }} ${{ steps.hostile.outputs.blocks }}
          C6: ${{ steps.subfolder.outcome }} result=${{ steps.subfolder.outputs.result }}
          C7: ${{ steps.mode_case.outcome }} ${{ steps.mode_case.outputs.result }} ${{ steps.mode_case.outputs.cause }} ${{ steps.mode_case.outputs.mode }} ${{ steps.mode_case.outputs.blocks }}
          L1: ${{ steps.no_test.outputs.log-line }}
          L3: ${{ steps.real_test.outputs.log-line }}
        run: |
          failed=0
          check() {
            if [ "$2" = "$3" ]; then
              echo "ok      $1: $2"
            else
              echo "::error title=action-selftest::$1: expected '$3', got '$2'"
              failed=1
            fi
          }
          check "case 1" "$C1" "failure STOPPED no-test block true"
          check "case 2" "$C2" "failure STOPPED test-passes-on-base block true"
          check "case 3" "$C3" "success PASSED ok block false"
          check "case 4" "$C4" "success STOPPED no-test report false"
          check "case 5" "$C5" "failure STOPPED no-test block true"
          check "case 6" "$C6" "failure result="
          check "case 7" "$C7" "failure STOPPED no-test block true"
          if ls "$RUNNER_TEMP"/HOSTILE_RAN_* >/dev/null 2>&1; then
            echo "::error title=action-selftest::a hostile file from the workspace ran inside the action: $(ls "$RUNNER_TEMP"/HOSTILE_RAN_*)"
            failed=1
          else
            echo "ok      no hostile json.py or sitecustomize.py ran inside the action"
          fi
          case "$L1" in cg2*STOPPED*no-test*) echo "ok      log line of case 1 is in the cg2 format" ;;
            *) echo "::error title=action-selftest::log line of case 1 is missing or not cg2: '$L1'"; failed=1 ;; esac
          case "$L3" in cg2*PASSED*ok*) echo "ok      log line of case 3 is in the cg2 format" ;;
            *) echo "::error title=action-selftest::log line of case 3 is missing or not cg2: '$L3'"; failed=1 ;; esac
          lines=$(wc -l < "$FIXTURE/.change-guard/runs.log" | tr -d ' ')
          # Cases 1 to 5 and 7 write one line each; case 6 is refused before the guard runs.
          check "log file lines" "$lines" "6"
          exit "$failed"
