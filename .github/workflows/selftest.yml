#
# Runs the change guard's own unit tests and seeded cases on every push and
# pull request. It only reads the repository.

name: selftest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Versions
        run: |
          python3 --version
          git --version

      - name: Unit tests
        run: python3 -B -m unittest discover -s tests -v

      - name: Seeded cases
        run: python3 -B seed_cases.py
